server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # config.js se regenera en cada arranque: no debe cachearse.
    location = /config.js {
        add_header Cache-Control "no-store";
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
